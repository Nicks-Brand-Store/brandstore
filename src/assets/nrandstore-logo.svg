<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-label="nrandstore logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#00C2A8" />
      <stop offset="100%" stop-color="#006EFA" />
    </linearGradient>
    <style>
      .brand { font-family: Inter, Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 36px; fill: #1F2937; }
      .tag { font-family: Inter, Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #6B7280; }
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(24,24)">
