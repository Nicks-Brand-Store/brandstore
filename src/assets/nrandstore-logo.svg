    <path d="M18 44C18 44 26 30 36 30C46 30 54 44 54 44" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M24 34c0-4 6-10 12-10 6 0 12 6 12 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,0)" />
